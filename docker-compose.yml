version: '3.8'

services:
  backend:
    build:
      context: ./express_agterend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./express_agterend:/usr/src/app
      - /usr/src/app/node_modules
      - db-data:/usr/src/app/data
    environment:
      - NODE_ENV=development
      - PORT=3000
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./react_gui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    environment:
      - NODE_ENV=production
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  db-data: